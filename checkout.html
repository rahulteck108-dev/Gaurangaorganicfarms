<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d6a4f">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/gm.png">
    <title>Checkout | Gauranga Organic Farm</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=7">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
        }

        .checkout-section {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .checkout-section h2 {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.8rem;
            color: var(--primary-dark);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .payment-method {
            border: 1px solid var(--border);
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            transition: var(--transition);
        }

        .payment-method:hover {
            border-color: var(--primary);
            background: rgba(45, 106, 79, 0.05);
        }

        .payment-method input[type="radio"] {
            transform: scale(1.4);
            accent-color: var(--primary);
        }

        .order-summary {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px dashed var(--border);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .summary-total {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            border-top: 2px solid var(--border);
            padding-top: 1.5rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar solid-nav">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-seedling"></i> Gauranga Organic
            </a>

            <div class="nav-icons">
                <a href="index.html" aria-label="Home"><i class="fas fa-arrow-left"></i> Back to Shop</a>
            </div>
        </div>
    </nav>

    <!-- Checkout Container with Separate Layouts -->
    <form class="checkout-container" onsubmit="handleCheckout(event)">

        <!-- 1. Address Layout (Left Column) -->
        <div class="checkout-section">
            <h2><i class="fas fa-map-marked-alt" style="color: var(--accent);"></i> Shipping Address</h2>

            <div class="input-group">
                <label>Full Name</label>
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" name="name" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                </div>
            </div>

            <div class="input-group">
                <label>Mobile Number</label>
                <div class="input-field">
                    <i class="fas fa-phone"></i>
                    <input type="tel" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
                </div>
            </div>

            <div class="input-group">
                <label>Street Address</label>
                <div class="input-field">
                    <i class="fas fa-home"></i>
                    <input type="text" name="address" placeholder="123 Farm Road, Sector 4" required>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>City / Town</label>
                    <div class="input-field">
                        <i class="fas fa-city"></i>
                        <input type="text" name="city" placeholder="Vrindavan" required>
                    </div>
                </div>
                <div class="input-group">
                    <label>Pincode</label>
                    <div class="input-field">
                        <i class="fas fa-map-pin"></i>
                        <input type="text" name="zip" placeholder="281121" required pattern="[0-9]{6}">
                    </div>
                </div>
            </div>

            <div class="input-group" style="margin-top: 1.5rem;">
                <label>Delivery Instructions (Optional)</label>
                <textarea name="instructions" rows="3"
                    style="width: 100%; padding: 1rem; border: 1px solid var(--border); border-radius: 8px; font-family: var(--font-body);"
                    placeholder="Leave at the front door..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary auth-btn"
                style="margin-top: 2.5rem; border-radius: 50px; font-size: 1.1rem; width: 100%; padding: 1rem;">
                Continue to Payment <i class="fas fa-arrow-right"></i>
            </button>
            <p style="text-align: center; color: var(--text-light); font-size: 0.8rem; margin-top: 1rem;"><i
                    class="fas fa-lock"></i> SSL Secured Information</p>
        </div>

    </form>

    <script>
        // Form Submit
        function handleCheckout(e) {
            e.preventDefault();

            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert("Your cart is empty! Please add items before checking out.");
                window.location.href = "index.html#shop";
                return;
            }

            const shipping = Object.fromEntries(new FormData(e.currentTarget).entries());
            sessionStorage.setItem('gauranga_checkout_shipping', JSON.stringify(shipping));
            window.location.href = "payment.html";
        }
    </script>

    <!-- WhatsApp Floating Button -->
    <a href="https://wa.me/916200057077?text=Hello%20Gauranga%20Organic%20Farm!%20I%20would%20like%20to%20know%20more%20about%20your%20pure%20organic%20and%20A2%20dairy%20products."
        class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" fill="currentColor" style="width: 35px; height: 35px;"><path d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
    </a>
    <script src="pwa.js"></script>
</body>

</html>
